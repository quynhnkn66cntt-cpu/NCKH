Organizations:

  - &OrdererOrg
    Name: OrdererMSP
    ID: OrdererMSP
    MSPDir: ../organizations/ordererOrganizations/example.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('OrdererMSP.admin')"

  - &FarmOrg
    Name: FarmMSP
    ID: FarmMSP
    MSPDir: ../organizations/peerOrganizations/farm.example.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('FarmMSP.admin', 'FarmMSP.peer', 'FarmMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('FarmMSP.admin', 'FarmMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('FarmMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('FarmMSP.peer')"
    AnchorPeers:
      - Host: peer0.farm.example.com
        Port: 7051

  - &ProcessingOrg
    Name: ProcessingMSP
    ID: ProcessingMSP
    MSPDir: ../organizations/peerOrganizations/processing.example.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('ProcessingMSP.admin', 'ProcessingMSP.peer', 'ProcessingMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('ProcessingMSP.admin', 'ProcessingMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('ProcessingMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('ProcessingMSP.peer')"
    AnchorPeers:
      - Host: peer0.processing.example.com
        Port: 8051

  - &DistributionOrg
    Name: DistributionMSP
    ID: DistributionMSP
    MSPDir: ../organizations/peerOrganizations/distribution.example.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('DistributionMSP.admin', 'DistributionMSP.peer', 'DistributionMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('DistributionMSP.admin', 'DistributionMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('DistributionMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('DistributionMSP.peer')"
    AnchorPeers:
      - Host: peer0.distribution.example.com
        Port: 9051


Capabilities:

  Channel: &ChannelCapabilities
    V2_0: true

  Orderer: &OrdererCapabilities
    V2_0: true

  Application: &ApplicationCapabilities
    V2_0: true


Application: &ApplicationDefaults
  Organizations:

  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"

    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"

    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"

    LifecycleEndorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"

    Endorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"

  Capabilities:
    <<: *ApplicationCapabilities


Orderer: &OrdererDefaults
  OrdererType: etcdraft

  EtcdRaft:
    Consenters:
      - Host: orderer.example.com
        Port: 7050
        ClientTLSCert: ../organizations/ordererOrganizations/example.com/orderers/orderer.example.com/tls/server.crt
        ServerTLSCert: ../organizations/ordererOrganizations/example.com/orderers/orderer.example.com/tls/server.crt

  Addresses:
    - orderer.example.com:7050

  BatchTimeout: 2s

  BatchSize:
    MaxMessageCount: 10
    AbsoluteMaxBytes: 99 MB
    PreferredMaxBytes: 512 KB

  Organizations:

  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"

    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"

    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"

    BlockValidation:
      Type: ImplicitMeta
      Rule: "ANY Writers"

  Capabilities:
    <<: *OrdererCapabilities


Channel: &ChannelDefaults
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"

    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"

    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"

  Capabilities:
    <<: *ChannelCapabilities


Profiles:

  TraceabilityChannel:
    <<: *ChannelDefaults

    Orderer:
      <<: *OrdererDefaults
      Organizations:
        - *OrdererOrg

    Application:
      <<: *ApplicationDefaults
      Organizations:
        - *FarmOrg
        - *ProcessingOrg
        - *DistributionOrg
