services:

  orderer.example.com:
    container_name: orderer.example.com
    image: hyperledger/fabric-orderer:2.5.16
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none

      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]

      - ORDERER_CHANNELPARTICIPATION_ENABLED=true

      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key


      - ORDERER_ADMIN_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:7053
    working_dir: /root
    command: orderer

    volumes:
      - ../organizations/ordererOrganizations/example.com/orderers/orderer.example.com/msp:/var/hyperledger/orderer/msp
      - ../organizations/ordererOrganizations/example.com/orderers/orderer.example.com/tls:/var/hyperledger/orderer/tls
      - orderer.example.com:/var/hyperledger/production/orderer

    ports:
      - "7050:7050"
      - "7053:7053"

    networks:
      - traceability


  peer0.farm.example.com:
    container_name: peer0.farm.example.com
    image: hyperledger/fabric-peer:2.5.16
    environment:
      - FABRIC_CFG_PATH=/etc/hyperledger/peercfg
      - FABRIC_LOGGING_SPEC=INFO

      - CORE_PEER_ID=peer0.farm.example.com
      - CORE_PEER_ADDRESS=peer0.farm.example.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.farm.example.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_PEER_LOCALMSPID=FarmMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp

      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt

      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.farm.example.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.farm.example.com:7051
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=traceability_network
    command: peer node start

    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../organizations/peerOrganizations/farm.example.com/peers/peer0.farm.example.com:/etc/hyperledger/fabric
      - ../../config:/etc/hyperledger/peercfg
      - peer0.farm.example.com:/var/hyperledger/production

    ports:
      - "7051:7051"

    networks:
      - traceability


  peer0.processing.example.com:
    container_name: peer0.processing.example.com
    image: hyperledger/fabric-peer:2.5.16
    environment:
      - FABRIC_CFG_PATH=/etc/hyperledger/peercfg
      - FABRIC_LOGGING_SPEC=INFO

      - CORE_PEER_ID=peer0.processing.example.com
      - CORE_PEER_ADDRESS=peer0.processing.example.com:8051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:8051
      - CORE_PEER_CHAINCODEADDRESS=peer0.processing.example.com:8052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:8052

      - CORE_PEER_LOCALMSPID=ProcessingMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt

      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.processing.example.com:8051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.processing.example.com:8051
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=traceability_network
    command: peer node start

    volumes:
      - ../organizations/peerOrganizations/processing.example.com/peers/peer0.processing.example.com:/etc/hyperledger/fabric
      - ../../config:/etc/hyperledger/peercfg
      - /var/run/docker.sock:/host/var/run/docker.sock
      - peer0.processing.example.com:/var/hyperledger/production

    ports:
      - "8051:8051"

    networks:
      - traceability


  peer0.distribution.example.com:
    container_name: peer0.distribution.example.com
    image: hyperledger/fabric-peer:2.5.16
    environment:
      - FABRIC_CFG_PATH=/etc/hyperledger/peercfg
      - FABRIC_LOGGING_SPEC=INFO

      - CORE_PEER_ID=peer0.distribution.example.com
      - CORE_PEER_ADDRESS=peer0.distribution.example.com:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_CHAINCODEADDRESS=peer0.distribution.example.com:9052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9052

      - CORE_PEER_LOCALMSPID=DistributionMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt

      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.distribution.example.com:9051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.distribution.example.com:9051
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=traceability_network
    command: peer node start

    volumes:
      - ../organizations/peerOrganizations/distribution.example.com/peers/peer0.distribution.example.com:/etc/hyperledger/fabric
      - ../../config:/etc/hyperledger/peercfg
      - /var/run/docker.sock:/host/var/run/docker.sock
      - peer0.distribution.example.com:/var/hyperledger/production

    ports:
      - "9051:9051"

    networks:
      - traceability


volumes:
  orderer.example.com:
  peer0.farm.example.com:
  peer0.processing.example.com:
  peer0.distribution.example.com:


networks:
  traceability:
    name: traceability_network
